<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GW2 API - Consultas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>⚔️ Guild Wars 2 - API Explorer</h1>
        
        <div class="search-section">
            <div class="search-box">
                <label for="searchType">Tipo de búsqueda:</label>
                <select id="searchType">
                    <option value="objects">Objetos (Items)</option>
                    <option value="skills">Habilidades</option>
                    <option value="traits">Rasgos</option>
                </select>
            </div>
            
            <div class="search-box">
                <label for="searchInput">Buscar (ID o nombre):</label>
                <input type="text" id="searchInput" placeholder="Ej: 12345, Bastión de la Muerte...">
                <button id="searchBtn">🔍 Buscar</button>
            </div>
        </div>

        <div id="results" class="results-container">
            <p class="hint">🔎 Introduce un ID o nombre para buscar</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
