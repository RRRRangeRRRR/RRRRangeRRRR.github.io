<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GW2 API Explorer - Guild Wars 2</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>⚔️ Guild Wars 2 Explorer</h1>
            <p class="subtitle">API de objetos, habilidades y rasgos</p>
        </header>
        
        <div class="search-section">
            <div class="search-box">
                <div class="search-group">
                    <label for="searchType">🔍 Tipo:</label>
                    <select id="searchType">
                        <option value="items">Objetos</option>
                        <option value="skills">Habilidades</option>
                        <option value="traits">Rasgos</option>
                    </select>
                </div>
                
                <div class="search-group search-input-group">
                    <label for="searchInput">ID del objeto:</label>
                    <input type="text" id="searchInput" placeholder="Ej: 12345, 14479, 278">
                    <button id="searchBtn">Buscar</button>
                </div>
            </div>
            
            <div class="search-tips">
                <small>💡 Introduce el ID numérico del objeto, habilidad o rasgo</small>
                <small id="resultCount" style="display:none;"></small>
            </div>
        </div>

        <div id="results" class="results-container">
            <div class="welcome-message">
                <div class="welcome-icon">🏹</div>
                <h2>¡Explora Tyria!</h2>
                <p>Busca objetos, habilidades o rasgos de Guild Wars 2 por su ID</p>
                <div class="examples">
                    <span>Ejemplos: </span>
                    <button class="example-btn" data-type="items" data-id="12345">Bastión de la Muerte</button>
                    <button class="example-btn" data-type="skills" data-id="14479">Meteoro</button>
                    <button class="example-btn" data-type="traits" data-id="278">Fuerza Vital</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
